name: Deploy development

on:
  workflow_dispatch: # manual run
  workflow_run: # mirrors epam/ai-dial-quickapps-frontend .github/workflows/deploy-development.yml
    workflows: ["Release Workflow"]
    types:
      - completed

permissions:
  contents: read

jobs:
  gitlab-dev-deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'development')
    uses: ./.github/workflows/mock-deploy-reusable.yml
    with:
      gitlab-project-id: "3450"
    secrets:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_ACCESS_TOKEN: ${{ secrets.DEPLOY_ACCESS_TOKEN }}
      DEPLOY_TRIGGER_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
